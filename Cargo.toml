[workspace]
# The Tauri app is a member (so it shares Cargo.lock and the workspace deps),
# but it is NOT in default-members: bare `cargo build/test/clippy` at the root
# keep covering only the crates, exactly like CI runs them.
members = ["crates/*", "apps/*/src-tauri"]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mahingbun-dev/FarAgent"
rust-version = "1.80"

[workspace.dependencies]
faragent-core = { path = "crates/faragent-core" }
faragent-install = { path = "crates/faragent-install" }
faragent-remote = { path = "crates/faragent-remote" }
faragent-service = { path = "crates/faragent-service" }
faragent-transport = { path = "crates/faragent-transport" }
faragent-tui = { path = "crates/faragent-tui" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
pretty_assertions = "1"
tempfile = "3"

# Release tuning: one codegen unit, fat LTO, stripped; panic=abort shrinks the
# Tauri app. (Profiles must live at the workspace root.)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
