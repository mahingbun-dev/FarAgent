[package]
name = "everywhere"
version = "0.1.0"
edition = "2021"
description = "SSH into remote coding agents and attach their native TUIs"
license = "MIT"
repository = "https://github.com/mahingbun-dev/everywhere-to-agent"
rust-version = "1.80"

[[bin]]
name = "everywhere"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
hex = "0.4"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
