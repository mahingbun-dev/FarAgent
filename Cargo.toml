[package]
name = "farssh"
version = "0.1.0"
edition = "2021"
description = "FarSSH: attach to coding agents on your own machines over SSH"
license = "MIT"
repository = "https://github.com/mahingbun-dev/FarSSH"
rust-version = "1.80"

[[bin]]
name = "farssh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
hex = "0.4"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
