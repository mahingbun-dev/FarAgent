[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mahingbun-dev/FarAgent"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
pretty_assertions = "1"
tempfile = "3"

[package]
name = "faragent"
version.workspace = true
edition.workspace = true
description = "FarAgent: attach to coding agents on your own machines over SSH"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "faragent"
path = "src/main.rs"

[dependencies]
faragent-core = { path = "crates/faragent-core" }
faragent-install = { path = "crates/faragent-install" }
faragent-remote = { path = "crates/faragent-remote" }
faragent-service = { path = "crates/faragent-service" }
faragent-transport = { path = "crates/faragent-transport" }
faragent-tui = { path = "crates/faragent-tui" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
