[package]
name = "faragent"
version = "0.1.0"
edition = "2021"
description = "FarAgent: attach to coding agents on your own machines over SSH"
license = "MIT"
repository = "https://github.com/mahingbun-dev/FarAgent"
rust-version = "1.80"

[[bin]]
name = "faragent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
