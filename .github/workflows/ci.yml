# CI：main 有新提交时运行 格式检查 + lint + 测试 + release 构建
# 仅在 main 收到提交（含 PR 合并）时触发；PR 事件不触发，需要时可手动 dispatch
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

  cross-platform:
    # 原生 Windows / macOS 的构建与单测（fmt/clippy 在上面的 ubuntu 作业里）
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

  frontend:
    # 桌面端前端：node --test 单测 + 生产构建（含 tsc）。
    # 上面两个作业只碰 Rust，前端坏了不会有人发现。
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/faragent-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/faragent-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
