# Release：推送 v* tag 时跨平台构建二进制与桌面安装包，并创建 GitHub Release
# 发版：git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
#
# 也可以手动触发（workflow_dispatch）：那时只跑构建、不建 Release，产物留在该次
# run 的 Artifacts 里 —— 用来验证打包链路，不必先打一个 tag。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 并上传产物

jobs:
  # --- 命令行二进制。与桌面应用是两条独立的线，互不依赖。 ---
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: faragent-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: faragent-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin   # arm64 runner 交叉编译 x86_64（macos-13 Intel runner 已退役）
            archive: faragent-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: faragent-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p faragent-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release faragent

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/faragent.exe -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  # --- helper 二进制。桌面安装包要把五个平台的 helper 全带上（它连的是各种远端），
  # 而没有任何一台 runner 能造齐五个：Apple 目标只在 macOS、MSVC 只在 Windows。
  # 所以矩阵按 runner 分工，产物靠 merge-multiple 汇到一棵树里 —— 见下面 app 的
  # download 步骤。造不了的平台由脚本「跳过并打印原因」，不是失败。
  helper:
    name: helper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platforms: "--platform linux-x86_64 --platform linux-aarch64"
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
            zig: true
          - os: macos-latest
            platforms: "--platform darwin-arm64 --platform darwin-x86_64"
            targets: x86_64-apple-darwin
            zig: false
          - os: windows-latest
            platforms: "--platform windows-x86_64"
            targets: ""
            zig: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Add cross targets
        if: matrix.targets != ''
        shell: bash
        run: rustup target add ${{ matrix.targets }}

      # Linux 目标用 musl 静态链接，需要 zig 当链接器。
      - uses: goto-bus-stop/setup-zig@v2
        if: matrix.zig

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked

      - name: Build helper artifacts
        shell: bash
        run: bash scripts/build-helper.sh ${{ matrix.platforms }}

      # 每个平台一个子目录，artifact 保留这层结构；app 那边 merge-multiple 下载
      # 之后就正好是 resources/helper/<platform>/faragent-helper。
      #
      # 名字里**故意没有** `faragent-` 前缀：下面 release 那个作业用
      # `pattern: faragent-*` 挑要发布的东西，而 helper 是构建安装包的中间产物，
      # 不是给人下载的。它一旦叫 `faragent-helper-*`，就会和 CLI 二进制、安装包
      # 一起被传上 Release。
      - name: Upload helper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.os }}
          path: apps/faragent-app/src-tauri/resources/helper/*/
          if-no-files-found: error

  # --- 桌面安装包。 ---
  app:
    name: app (${{ matrix.os }})
    needs: helper
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-latest
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # 构建产物落在 workspace 根的 target/（Cargo 的共享 target 目录），不是
      # apps/faragent-app/src-tauri/target/ —— 下面的上传路径按前者写。
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/faragent-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/faragent-app
        run: npm ci

      # 五个平台的 helper 全都要在包里，一个都不能少：少了哪个，装了这款应用的
      # 人就连不上那一类远端，而失败会发生在使用时、不在打包时。
      - name: Fetch the helper binaries
        uses: actions/download-artifact@v4
        with:
          pattern: helper-*
          merge-multiple: true
          path: apps/faragent-app/src-tauri/resources/helper

      - name: Install the Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build the desktop bundle
        working-directory: apps/faragent-app
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: faragent-app-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # --- 把两边的产物汇成一个 Release。
  release:
    # 手动触发时不建 Release：那时 GITHUB_REF_NAME 是分支名，会造出一个叫
    # "main" 的版本。
    if: github.event_name == 'push'
    needs: [build, app]
    runs-on: ubuntu-latest
    steps:
      # `faragent-*` 只够得着 CLI 二进制和安装包。helper 的 artifact 叫
      # `helper-<os>`，正好被排除在外 —— 它是构建安装包的中间产物，传上去只会
      # 让下载页多出五个没人要的文件。没有 pattern 会把它们全带上。
      - uses: actions/download-artifact@v4
        with:
          pattern: faragent-*
          path: dist
          merge-multiple: true

      # 这个作业不 checkout —— 它不需要源码，只要下载下来的产物 —— 于是工作目录
      # 里没有 `.git`，而 `gh` 默认就是靠它推断"这是哪个仓库"的。它报
      # `fatal: not a git repository`，退出码 1，Release 一个都没建。v0.1.0 的
      # 发布就是这么失败的，而且两个月没人发现，因为那次失败什么都没弄坏 ——
      # 只是没有下载页而已。`--repo` 把这件事说明白，比补一个 checkout 少一步。
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
